name: Test

on:
  workflow_call:  # Called by CI workflow
  workflow_dispatch:  # Allow manual triggering

concurrency:
  # Use run_id when called from CI to avoid deadlock with caller's group (CI-refs/heads/main)
  group: ${{ github.workflow || 'Test' }}-${{ github.run_id || github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Always run - this workflow only has workflow_call and workflow_dispatch triggers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false

      # Test the action directly with default values
      - name: Test - Default values
        id: test-default
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        continue-on-error: true

      - name: Verify default test results
        env:
          Z_TEST_DEFAULT_OUTCOME: ${{ steps.test-default.outcome }}
          Z_TEST_DEFAULT_OUTPUTS_BINARY_PATH: ${{ steps.test-default.outputs.binary-path }}
          Z_TEST_DEFAULT_OUTPUTS_VERSION: ${{ steps.test-default.outputs.version }}
        run: |
          if [ "${Z_TEST_DEFAULT_OUTCOME}" != "success" ]; then
            echo "Default test failed, but this is expected if no token is provided"
          else
            echo "✓ Default test passed"
            echo "Binary path: ${Z_TEST_DEFAULT_OUTPUTS_BINARY_PATH}"
            echo "Version: ${Z_TEST_DEFAULT_OUTPUTS_VERSION}"
          fi

      # Test with explicit version
      - name: Test - Explicit version
        id: test-version
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          version: '0.9.0'
        continue-on-error: true

      - name: Verify version test results
        env:
          Z_TEST_VERSION_OUTCOME: ${{ steps.test-version.outcome }}
          Z_TEST_VERSION_OUTPUTS_VERSION: ${{ steps.test-version.outputs.version }}
        run: |
          if [ "${Z_TEST_VERSION_OUTCOME}" != "success" ]; then
            echo "Version test failed"
            exit 1
          fi
          echo "✓ Version test passed"
          if [ -n "${Z_TEST_VERSION_OUTPUTS_VERSION}" ]; then
            echo "Installed version: ${Z_TEST_VERSION_OUTPUTS_VERSION}"
          fi

      # Test with custom repo URL
      - name: Test - Custom repo URL
        id: test-repo
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          repo: 'https://gitea.com'
        continue-on-error: true

      - name: Verify repo test results
        env:
          Z_TEST_REPO_OUTCOME: ${{ steps.test-repo.outcome }}
        run: |
          if [ "${Z_TEST_REPO_OUTCOME}" != "success" ]; then
            echo "Repo test failed, but this is expected if no token is provided"
          else
            echo "✓ Repo test passed"
          fi

      # Verify binary is accessible
      - name: Verify binary in PATH
        run: |
          if command -v tea &> /dev/null; then
            echo "✓ tea is in PATH"
            tea --version || echo "tea --version failed (expected if not authenticated)"
          else
            echo "✗ tea is not in PATH"
            exit 1
          fi

      # Verify binary path output
      - name: Verify binary path output
        run: |
          if [ -f "/usr/local/bin/tea" ]; then
            echo "✓ Binary exists at /usr/local/bin/tea"
            /usr/local/bin/tea --version || echo "Binary exists but may not be functional"
          else
            echo "✗ Binary does not exist at /usr/local/bin/tea"
            exit 1
          fi

      # Runs the script directly rather than through `uses: ./`, because a composite step
      # exiting non-zero fails the job and here a non-zero exit is the PASS. On a disposable
      # runner only -- this script installs a binary into /usr/local/bin.
      - name: Test - rejects a version that retargets the download URL
        run: |
          for bad in '../../../other/repo/releases/download/v1/payload' 'x;id' '..' 'a b'; do
            set +e
            out=$(INPUT_VERSION="$bad" INPUT_VERBOSE=false bash ./install-tea.sh 2>&1); rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::version '$bad' was accepted"; exit 1
            fi
            echo "$out" | grep -q 'must look like a release version' \
              || { echo "::error::version '$bad' rejected, but not by the version guard"; echo "$out"; exit 1; }
            echo "  ✓ refused: $bad"
          done
          echo "✓ all retargeting versions refused"

      - name: Test Summary
        run: |
          {
            echo "## ✅ Test Summary"
            echo ""
            echo "All tests completed successfully!"
            echo ""
            echo "- Binary location: \`/usr/local/bin/tea\`"
            echo "- Binary is in PATH: ✅"
          } >> "$GITHUB_STEP_SUMMARY"
